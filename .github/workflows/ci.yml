name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "18"
          - os: ubuntu-latest
            runtime: "22"
          - os: ubuntu-latest
            runtime: "24"
          - os: windows-latest
            runtime: "22"
          - os: macos-latest
            runtime: "22"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: 073b0396db55c903ca114f15fab8cf83c4b92e3d
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Select consumer runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.runtime }}
      - name: HTTP contract
        run: python tests/contract/run.py -- node tests/consumer.mjs
      - name: Resilience contract
        run: python tests/contract/resilience.py -- node tests/resilience.mjs
      - name: Check example syntax
        run: node --check examples/catalog.mjs
      - name: Build package
        run: npm pack --ignore-scripts
      - name: Check application integration example
        run: node --check examples/integration.mjs

      - name: Bounded iteration contract
        run: |
          python tests/contract/iteration.py -- node tests/iteration.mjs
      - name: Public API compatibility
        run: |
          python scripts/check_api.py -- node scripts/api_surface.mjs

  browser:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}

  quality:
    name: Performance and package verification
    needs: [verify, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSER_ROOT_VERSION: 1.0.0-rc.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
      - name: Prepare SDK and benchmark
        run: |
          npm ci
          npm run build
          python -m pip install psutil==7.2.2
          mkdir -p artifacts
      - name: Build and install package candidate
        run: |
          npm pack --ignore-scripts --pack-destination artifacts
          python scripts/verify_artifact.py
      - name: Measure transport and check performance baseline
        run: |
          python benchmarks/run.py --platform github-ubuntu24-x64 --baseline benchmarks/baseline.json --output benchmark-results.json  -- node benchmarks/consumer.mjs
      - name: Record exact artifact hashes
        run: |
          python scripts/artifact_manifest.py
      - name: Retain benchmark evidence
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: sdk-benchmark
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain verified package candidates
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: sdk-verified-build
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  provenance:
    name: Sign and verify build provenance
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: sdk-verified-build
          path: artifacts
      - name: Attest verified build artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/*
          push-to-registry: false
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in artifacts/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Retain provenance bundle
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: sdk-build-provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
